name: Publish npm

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        type: choice
        options:
          - cli
          - mcp
          - agent-installer
        required: true
      tag:
        description: "npm dist-tag (default: latest)"
        required: false
        default: latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Gate - check before publish
        run: pnpm check

      - name: Upgrade npm for trusted publishing (OIDC needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Pack (rewrite workspace dependencies)
        id: pack
        # `npm publish` does not understand pnpm's `workspace:*` protocol and
        # would ship it verbatim, producing an uninstallable tarball. Pack with
        # pnpm first so workspace deps are rewritten to concrete versions.
        working-directory: packages/${{ inputs.package }}
        run: |
          set -euo pipefail
          pnpm pack --pack-destination "$RUNNER_TEMP" >/dev/null
          name="$(node -p "require('./package.json').name.replace('@','').replace('/','-')")"
          version="$(node -p "require('./package.json').version")"
          echo "tarball=$RUNNER_TEMP/${name}-${version}.tgz" >> "$GITHUB_OUTPUT"

      - name: Publish with trusted publishing + provenance
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance --tag "${{ inputs.tag }}"
